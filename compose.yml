services:
  db:
    image: mongo:8.0.4-rc0
    restart: always
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 192M
    cpus: 0.25
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: nullSkillz42
    volumes:
      - mongodb_data:/data/db

  backend:
    container_name: sdv-klavir-backend
    image: banana4242/sdv_klavir_backend
    environment:
        - NODE_ENV=production
        - SERVICE_NAME=sdv_klavir/backend
        - JWT_SECRET=secret
        - PORT=3000
        - DATABASE_URL=mongodb://root:nullSkillz42@db:27017
        - EXTERNAL_URL=https://klavir.dendroscopos.si/v1
        - FRONTEND_URL=https://klavir.dendroscopos.si
        - API_PREFIX=/v1
        - TZ=Europe/Ljubljana
        - NODE_OPTIONS=--max-old-space-size=96     # keep V8 heap below the container limit
    restart: always
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 128M
    cpus: 0.25
    ports:
      - '3000:3000'
    depends_on:
      - db

  nginx:
    container_name: sdv-klavir-nginx
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./frontend/SDV_klavir/nginx.conf:/etc/nginx/nginx.conf
      - /var/www/certbot/:/var/www/certbot/
    image: banana4242/sdv_klavir_frontend
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    cpus: 0.15
    ports:
      - '8080:80'

volumes:
  mongodb_data:
